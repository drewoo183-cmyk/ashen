<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пепельный Тракт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0914; --panel: #16121f; --card: #1e192c; --border: #3a2f54;
    --gold: #ffc857; --hp: #e63946; --accent: #8a2be2; --text: #e0dced; --muted: #8b839c;
    --btn: #2a233b; --btn-hover: #3d3356;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ПАНЕЛЬ СТАТИСТИКИ */
  .top-bar { background: var(--panel); padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
  .stat-pill { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.05); }
  .hp-bar-wrap { width: 100%; height: 6px; background: #000; border-radius: 3px; overflow: hidden; }
  .hp-bar-fill { height: 100%; background: var(--hp); transition: width 0.3s; }
  
  .progress-track { display: flex; gap: 4px; padding: 10px 12px; background: #08060a; }
  .dot { flex: 1; height: 4px; background: #1e192c; border-radius: 2px; }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--gold); box-shadow: 0 0 5px var(--gold); }

  /* ЦЕНТРАЛЬНАЯ СЦЕНА (ИГРОВАЯ КАРТОЧКА) */
  .stage { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  
  .game-card {
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    overflow: hidden; display: flex; flex-direction: column; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-img-wrap { width: 100%; height: 220px; position: relative; background: #000; }
  .card-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: 0.3s; }
  .card-badge { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border: 1px solid var(--accent); padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; backdrop-filter: blur(4px); z-index: 2; }
  
  .card-content { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .card-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; text-align: center; color: var(--gold); }
  .card-desc { font-size: 14px; color: var(--muted); line-height: 1.5; text-align: center; margin-bottom: 16px; min-height: 42px; }

  /* КНОПКИ ВЫБОРА */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
  .actions.single { grid-template-columns: 1fr; }
  .btn { background: var(--btn); border: 1px solid var(--border); color: var(--text); padding: 14px 10px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.1s; }
  .btn:active { background: var(--btn-hover); transform: scale(0.96); }
  .btn-hint { font-size: 10px; color: var(--muted); font-weight: normal; }
  .btn-accent { border-color: var(--hp); background: rgba(230, 57, 70, 0.1); }

  /* НИЖНЯЯ ПАНЕЛЬ ИНВЕНТАРЯ */
  .bottom-bar { background: var(--panel); border-top: 1px solid var(--border); padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 10; }
  .slot { background: var(--btn); border: 1px solid var(--border); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; transition: 0.1s; }
  .slot:active { transform: scale(0.92); }
  .slot-icon { font-size: 20px; margin-bottom: 4px; display: block; }
  .slot-stat { color: var(--text); font-weight: bold; margin-top: 2px; }

  /* ЭФФЕКТЫ БОЯ */
  .hit-shake { animation: shake 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); filter: brightness(1); } 25% { transform: translateX(-8px); filter: brightness(2) 0; } 75% { transform: translateX(8px); } }

</style>
</head>
<body>

<div class="top-bar">
  <div class="stats-row">
    <div class="stat-pill">❤️ <span id="hp-txt">100/100</span></div>
    <div class="stat-pill">⚔️ <span id="atk-txt">12</span></div>
    <div class="stat-pill">🛡️ <span id="def-txt">3</span></div>
    <div class="stat-pill" style="color:var(--gold)">🪙 <span id="gold-txt">0</span></div>
  </div>
  <div class="hp-bar-wrap"><div class="hp-bar-fill" id="hp-bar"></div></div>
</div>
<div class="progress-track" id="progress"></div>

<div class="stage" id="stage">
  <!-- Тут генерируются карточки -->
</div>

<div class="bottom-bar">
  <div class="slot" onclick="alert('Твое Оружие: ' + state.eq.weapon.name + ' (+'+state.eq.weapon.stat+' АТК)')">
    <span class="slot-icon">🗡️</span>Оружие<div class="slot-stat" id="eq-w">+5</div>
  </div>
  <div class="slot" onclick="alert('Твоя Броня: ' + state.eq.armor.name + ' (+'+state.eq.armor.stat+' ЗАЩ)')">
    <span class="slot-icon">🛡️</span>Броня<div class="slot-stat" id="eq-a">+2</div>
  </div>
  <div class="slot" onclick="alert('Твое Кольцо: ' + state.eq.ring.name + ' (+'+state.eq.ring.stat+' HP)')">
    <span class="slot-icon">💍</span>Кольцо<div class="slot-stat" id="eq-r">+0</div>
  </div>
  <div class="slot" onclick="alert(state.ally ? 'Напарник: ' + state.ally.name + ' (+'+state.ally.atk+' АТК)' : 'Нет напарника')">
    <span class="slot-icon">👤</span>Напарник<div class="slot-stat" id="eq-al">Нет</div>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.expand(); tg.ready(); }
  function haptic(type = 'light') { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type); }

  // Генератор картинок на лету (запросы к ИИ)
  const imgAPI = (prompt) => `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=400&height=300&nologo=true`;

  const state = {
    step: 1, maxSteps: 7, act: 1,
    hp: 100, maxHp: 100, baseAtk: 7, baseDef: 1, gold: 20,
    eq: { 
      weapon: { name: "Ржавый меч", stat: 5 }, 
      armor: { name: "Старая накидка", stat: 2 }, 
      ring: { name: "Пусто", stat: 0 } 
    },
    ally: null
  };

  function updateHUD() {
    state.maxHp = 100 + state.eq.ring.stat;
    if (state.hp > state.maxHp) state.hp = state.maxHp;
    
    document.getElementById('hp-txt').innerText = `${state.hp}/${state.maxHp}`;
    document.getElementById('hp-bar').style.width = `${(state.hp/state.maxHp)*100}%`;
    document.getElementById('atk-txt').innerText = state.baseAtk + state.eq.weapon.stat + (state.ally ? state.ally.atk : 0);
    document.getElementById('def-txt').innerText = state.baseDef + state.eq.armor.stat;
    document.getElementById('gold-txt').innerText = state.gold;
    
    document.getElementById('eq-w').innerText = `+${state.eq.weapon.stat}`;
    document.getElementById('eq-a').innerText = `+${state.eq.armor.stat}`;
    document.getElementById('eq-r').innerText = `+${state.eq.ring.stat}`;
    document.getElementById('eq-al').innerText = state.ally ? `+${state.ally.atk}` : 'Нет';

    let dots = '';
    for(let i=1; i<=state.maxSteps; i++) {
      dots += `<div class="dot ${i < state.step ? 'done' : i === state.step ? 'current' : ''}"></div>`;
    }
    document.getElementById('progress').innerHTML = dots;
  }

  function renderCard({ badge, img, title, desc, btnLeft, btnRight, actionLeft, actionRight, isSingleBtn }) {
    const stage = document.getElementById('stage');
    
    let btnsHTML = '';
    if (isSingleBtn) {
      btnsHTML = `<button class="btn" onclick="haptic(); ${actionLeft}"><span>${btnLeft.text}</span><span class="btn-hint">${btnLeft.hint}</span></button>`;
    } else {
      btnsHTML = `
        <button class="btn" onclick="haptic('medium'); ${actionLeft}"><span>${btnLeft.text}</span><span class="btn-hint">${btnLeft.hint}</span></button>
        <button class="btn ${btnRight.isDanger ? 'btn-accent' : ''}" onclick="haptic('heavy'); ${actionRight}"><span>${btnRight.text}</span><span class="btn-hint">${btnRight.hint}</span></button>
      `;
    }

    stage.innerHTML = `
      <div class="game-card" id="current-card">
        <div class="card-img-wrap">
          <div class="card-badge">${badge}</div>
          <img src="${img}" class="card-img" id="card-image">
        </div>
        <div class="card-content">
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
          <div class="actions ${isSingleBtn ? 'single' : ''}">${btnsHTML}</div>
        </div>
      </div>
    `;
    updateHUD();
  }

  // --- ИГРОВОЙ ЦИКЛ ---

  function startStep() {
    updateHUD();
    if (state.step > state.maxSteps) {
      state.act++;
      state.step = 1;
    }
    
    // Анимация бега от первого лица
    renderCard({
      badge: "В пути",
      img: imgAPI(`first person view running down a dark stone road, dark fantasy rpg background, gloomy, act ${state.act}`),
      title: `Тракт, Километр ${state.step}`,
      desc: "Ты бежишь вперед. Туман сзади подступает всё ближе. Нужно двигаться.",
      isSingleBtn: true,
      btnLeft: { text: "Бежать дальше", hint: "Сделать шаг" },
      actionLeft: "resolveEncounter()"
    });
  }

  function resolveEncounter() {
    if (state.step === state.maxSteps) return bossEncounter();
    
    const roll = Math.random();
    if (roll < 0.3) storyEvent1();
    else if (roll < 0.6) storyEvent2();
    else startBattle(generateEnemy());
  }

  // --- СЮЖЕТНЫЕ СОБЫТИЯ ---

  function storyEvent1() {
    renderCard({
      badge: "Развилка",
      img: imgAPI("dark fantasy broken bridge over mist, glowing runes, rpg landscape"),
      title: "Разрушенный мост",
      desc: "Прямой путь разрушен. Можно спуститься в ущелье (опасно, но есть шанс найти лут) или пойти в обход.",
      btnLeft: { text: "В обход", hint: "Безопасно" },
      btnRight: { text: "В ущелье", hint: "Бой и Трофей" },
      actionLeft: "state.step++; startStep();",
      actionRight: "startBattle(generateEnemy(), true)" // true = гарантированный лут
    });
  }

  function storyEvent2() {
    renderCard({
      badge: "Алтарь",
      img: imgAPI("dark fantasy bloody stone altar in forest glowing red, rpg"),
      title: "Алтарь Жертвы",
      desc: "Статуя требует крови. Если пожертвовать здоровьем, она может даровать случайный артефакт.",
      btnLeft: { text: "Уйти", hint: "Остаться целым" },
      btnRight: { text: "Пролить кровь", hint: "-25 ❤️, Получить вещь", isDanger: true },
      actionLeft: "state.step++; startStep();",
      actionRight: "state.hp -= 25; if(state.hp<=0) state.hp=1; showLoot();"
    });
  }

  // --- БОЕВКА ---

  function generateEnemy() {
    const names = ["Скверный Мародер", "Гончая Углей", "Мертвый Стражник", "Упырь"];
    const mult = 1 + (state.act * 0.3) + (state.step * 0.1);
    return {
      name: names[Math.floor(Math.random() * names.length)],
      hp: Math.floor(40 * mult),
      atk: Math.floor(10 * mult),
      img: imgAPI("dark fantasy scary monster enemy, dark background, rpg character portrait")
    };
  }

  function bossEncounter() {
    const boss = {
      name: "Древний Страж",
      hp: 120 * state.act,
      atk: 18 * state.act,
      img: imgAPI("epic dark fantasy armored boss monster with glowing eyes standing on road")
    };
    renderCard({
      badge: "БОСС ЛОКАЦИИ",
      img: boss.img,
      title: boss.name,
      desc: `Впереди страж... Готовь оружие, или этот путь станет последним! Здоровье врага: ❤️ ${boss.hp}`,
      btnLeft: { text: "Сбежать", hint: "-20 ❤️, назад на шаг" },
      btnRight: { text: "В БОЙ!", hint: "Смертельная битва", isDanger: true },
      actionLeft: "state.hp -= 20; state.step--; startStep();",
      actionRight: `processCombat(${JSON.stringify(boss)}, true)`
    });
  }

  function startBattle(enemy, guaranteedLoot = false) {
    renderCard({
      badge: "ВРАГ НА ПУТИ",
      img: enemy.img,
      title: enemy.name,
      desc: `Он преградил дорогу. \nУ врага: ❤️ ${enemy.hp} | ⚔️ ${enemy.atk}`,
      btnLeft: { text: "Пройти мимо", hint: "Невозможно" }, // Просто для визуала 2 кнопок
      btnRight: { text: "Атаковать", hint: "Начать автобой", isDanger: true },
      actionLeft: "haptic('error');",
      actionRight: `processCombat(${JSON.stringify(enemy)}, ${guaranteedLoot})`
    });
  }

  function processCombat(enemy, guaranteedLoot) {
    const imgEl = document.getElementById('card-image');
    let eHp = enemy.hp;
    const myAtk = state.baseAtk + state.eq.weapon.stat + (state.ally ? state.ally.atk : 0);
    const myDef = state.baseDef + state.eq.armor.stat;

    // Имитация пошагового удара
    const interval = setInterval(() => {
      // Мой удар
      eHp -= myAtk;
      imgEl.classList.add('hit-shake');
      haptic('medium');
      setTimeout(() => imgEl.classList.remove('hit-shake'), 400);

      if (eHp <= 0) {
        clearInterval(interval);
        state.gold += 15 * state.act;
        if (guaranteedLoot || Math.random() > 0.4) setTimeout(() => showLoot(), 600);
        else { state.step++; setTimeout(() => startStep(), 600); }
        return;
      }

      // Удар врага
      const dmg = Math.max(1, enemy.atk - myDef);
      state.hp -= dmg;
      updateHUD();
      haptic('heavy');
      
      if (state.hp <= 0) {
        clearInterval(interval);
        alert("Ты погиб! Осколок переносит тебя в начало пути.");
        state.hp = state.maxHp; state.step = 1;
        startStep();
      }
    }, 800);
  }

  // --- ЛУТ И ЭКИПИРОВКА ---

  function showLoot() {
    const types = ['weapon', 'armor', 'ring'];
    const type = types[Math.floor(Math.random() * types.length)];
    const names = { weapon: ["Клык Бездны", "Эфирный Меч"], armor: ["Темные Латы", "Плащ Тени"], ring: ["Кольцо Жизни", "Руна Крови"] };
    const name = names[type][Math.floor(Math.random()*2)];
    
    const mult = 1 + (state.act * 0.5) + (state.step * 0.1);
    const stat = Math.floor((type === 'ring' ? 20 : 6) * mult);
    const sellPrice = stat * 2;
    
    const statName = type === 'weapon' ? 'АТК' : type === 'armor' ? 'ЗАЩ' : 'HP';
    const oldStat = state.eq[type].stat;
    const diff = stat - oldStat;
    const diffText = diff >= 0 ? `+${diff} лучше` : `${diff} хуже`;

    // Сохраняем сгенерированный предмет глобально для функции кнопок
    window.tempLoot = { type, name, stat };
    
    let prompt = type === 'weapon' ? 'epic magic sword' : type === 'armor' ? 'epic dark fantasy armor' : 'glowing magic ring';

    renderCard({
      badge: "ТРОФЕЙ",
      img: imgAPI(`${prompt} glowing isolated on black background, rpg inventory item`),
      title: name,
      desc: `Дает +${stat} ${statName}. <br><span style="color:${diff>=0?'#4cc9f0':'#e63946'}; font-size:12px;">(На ${diffText} твоей вещи)</span>`,
      btnLeft: { text: "Продать", hint: `+${sellPrice} 🪙` },
      btnRight: { text: "Надеть", hint: "Заменить старое" },
      actionLeft: `state.gold += ${sellPrice}; state.step++; startStep();`,
      actionRight: `state.eq['${type}'] = window.tempLoot; state.step++; startStep();`
    });
  }

  // Запуск игры
  startStep();
</script>
</body>
</html>
