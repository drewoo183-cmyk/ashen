<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пепельный Тракт — Telegram RPG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0c12; --panel: #171520; --card: #211e2e; --border: #38324c;
    --gold: #f5b942; --hp: #e63946; --accent: #9d4edd; --text: #f1eef7; --muted: #8e87a3;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ПАНЕЛИ И UI (остались прежними для сохранения структуры) */
  .top-bar { background: var(--panel); padding: 10px 14px; border-bottom: 1px solid var(--border); z-index: 10; }
  .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; margin-bottom: 8px;}
  .stat-pill { background: rgba(255,255,255,0.06); padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
  .hp-bar-wrap { width: 100%; height: 10px; background: #2a2438; border-radius: 5px; }
  .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #e63946, #ff6b6b); transition: width 0.3s; }
  
  .runner-track { background: #12101a; padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; font-size: 12px; color: var(--muted); }
  .step-dots { display: flex; gap: 5px; flex: 1; margin: 0 12px; }
  .dot { flex: 1; height: 6px; background: #2a2538; border-radius: 3px; }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dot.boss { background: var(--hp); height: 10px; }

  /* ЦЕНТРАЛЬНАЯ СЦЕНА И АНИМАЦИИ */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; overflow: hidden; }
  
  /* ПАРАЛЛАКС ФОН ДЛЯ БЕГА */
  .scrolling-bg {
    position: absolute; inset: 0; z-index: 0; opacity: 0.3;
    background: repeating-linear-gradient(90deg, transparent 0%, rgba(157,78,221,0.1) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: scrollBg 3s linear infinite;
    display: none;
  }
  @keyframes scrollBg { 0% { background-position: 0 0; } 100% { background-position: -200% 0; } }

  .game-card { width: 100%; max-width: 340px; min-height: 380px; background: #191624; border: 2px solid var(--border); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 2; transition: transform 0.15s; }
  
  /* ИЗОБРАЖЕНИЯ И АРТЫ */
  .art-container { width: 120px; height: 120px; border-radius: 16px; margin: 10px 0; overflow: hidden; border: 2px solid var(--border); position: relative; background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .art-img { width: 100%; height: 100%; object-fit: cover; }
  
  /* ДИАЛОГИ */
  .dialogue-box { background: rgba(0,0,0,0.5); border-left: 3px solid var(--accent); padding: 10px; margin: 10px 0; font-size: 13px; font-style: italic; color: #d6d1e6; text-align: left; width: 100%; border-radius: 0 8px 8px 0; min-height: 50px; }
  
  .swipe-hints { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
  .choice-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); padding: 11px 8px; border-radius: 12px; font-size: 12px; cursor: pointer; }

  /* АНИМАЦИИ БОЯ И БЕГА */
  @keyframes runAnim { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-10px) rotate(3deg); } 75% { transform: translateY(-10px) rotate(-3deg); } }
  .running { animation: runAnim 0.6s infinite ease-in-out; }
  
  .battle-arena { width: 100%; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 2; }
  .fighters-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 15px; position: relative; }
  .fighter { flex: 1; display: flex; flex-direction: column; align-items: center; transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  
  /* ЭФФЕКТЫ УДАРА */
  .atk-right { transform: translateX(30px) scale(1.1); z-index: 10; }
  .atk-left { transform: translateX(-30px) scale(1.1); z-index: 10; }
  .hit-shake { animation: shake 0.3s; filter: brightness(2) 0; border-color: var(--hp) !important; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .slash-effect { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10 90 L90 10" stroke="red" stroke-width="8" stroke-linecap="round"/></svg>') no-repeat center; opacity: 0; pointer-events: none; z-index: 20; transition: 0.1s; }
  .slash-active { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }

  .bottom-bar { background: var(--panel); padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 10; }
  .slot { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; text-align: center; font-size: 10px; }
  .slot-img { width: 30px; height: 30px; margin-bottom: 4px; object-fit: contain; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="stats-row">
    <div class="stat-pill">❤️ <span id="hp-txt">100</span></div>
    <div class="stat-pill">⚔️ <span id="atk-txt">12</span></div>
    <div class="stat-pill">🛡️ <span id="def-txt">3</span></div>
    <div class="stat-pill" style="color:var(--gold)">🪙 <span id="gold-txt">50</span></div>
  </div>
  <div class="hp-bar-wrap"><div class="hp-bar-fill" id="hp-bar"></div></div>
</div>

<div class="runner-track">
  <div class="step-dots" id="step-dots"></div>
</div>

<div class="stage" id="stage">
  <div class="scrolling-bg" id="bg-effect"></div>
  <div id="stage-content" style="width: 100%; display: flex; justify-content: center;"></div>
</div>

<div class="bottom-bar">
  <div class="slot"><img src="https://api.dicebear.com/7.x/icons/svg?seed=sword" class="slot-img"><br><span id="w-stat">Оружие</span></div>
  <div class="slot"><img src="https://api.dicebear.com/7.x/icons/svg?seed=shield" class="slot-img"><br><span id="a-stat">Броня</span></div>
  <div class="slot"><img src="https://api.dicebear.com/7.x/icons/svg?seed=ring" class="slot-img"><br><span id="r-stat">Кольцо</span></div>
  <div class="slot"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=ally" class="slot-img"><br><span id="ally-stat">Напарник</span></div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.expand(); }
  function haptic(type = 'light') { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type); }

  const state = { step: 1, maxSteps: 8, hp: 100, maxHp: 100, atk: 7, def: 1, gold: 60 };

  // БАЗА АРТОВ (Здесь ты потом заменишь ссылки URL на свои картинки)
  const assets = {
    hero: "https://api.dicebear.com/7.x/adventurer/svg?seed=Gonec&backgroundColor=171520",
    runBg: "https://api.dicebear.com/7.x/shapes/svg?seed=forest",
    enemies: [
      { name: "Гончая Углей", img: "https://api.dicebear.com/7.x/bottts/svg?seed=Wolf&backgroundColor=4a1515", hp: 50, atk: 10 },
      { name: "Мародер", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit&backgroundColor=2d2a1c", hp: 60, atk: 12 },
      { name: "Босс: Висельник", img: "https://api.dicebear.com/7.x/bottts/svg?seed=Boss1&backgroundColor=300707", hp: 150, atk: 20, isBoss: true }
    ],
    items: {
      weapon: { img: "https://api.dicebear.com/7.x/icons/svg?seed=sword2", stat: 15 },
      armor: { img: "https://api.dicebear.com/7.x/icons/svg?seed=armor2", stat: 8 }
    }
  };

  function updateHUD() {
    document.getElementById('hp-txt').innerText = state.hp;
    document.getElementById('hp-bar').style.width = `${(state.hp / state.maxHp) * 100}%`;
    document.getElementById('gold-txt').innerText = state.gold;
    const dots = document.getElementById('step-dots');
    dots.innerHTML = '';
    for (let i = 1; i <= state.maxSteps; i++) {
      dots.innerHTML += `<div class="dot ${i < state.step ? 'done' : i === state.step ? 'current' : ''}"></div>`;
    }
  }

  // ЭФФЕКТ ПЕЧАТИ ТЕКСТА ДЛЯ ДИАЛОГОВ
  function typeText(elementId, text, speed = 30) {
    const el = document.getElementById(elementId);
    el.innerHTML = '';
    let i = 0;
    function type() {
      if (i < text.length) {
        el.innerHTML += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }
    type();
  }

  // АНИМАЦИЯ БЕГА
  function runForward() {
    updateHUD();
    document.getElementById('bg-effect').style.display = 'block';
    
    document.getElementById('stage-content').innerHTML = `
      <div class="game-card" style="border:none; background:transparent; box-shadow:none;">
        <div class="art-container running" style="width:160px; height:160px; border-radius:50%; background:transparent; border:none;">
          <img src="${assets.hero}" class="art-img">
        </div>
        <div class="dialogue-box" id="run-text" style="text-align:center; border:none; background:transparent;"></div>
      </div>
    `;
    typeText('run-text', "Гонец мчится по пепельному тракту...");
    haptic('light');
    
    setTimeout(() => {
      document.getElementById('bg-effect').style.display = 'none';
      triggerEncounter();
    }, 1800);
  }

  function triggerEncounter() {
    if (state.step === state.maxSteps) return startBattle(assets.enemies[2]); // Boss
    Math.random() > 0.5 ? showDialogueEvent() : startBattle(assets.enemies[0]);
  }

  // ДИАЛОГИ С NPC И СОБЫТИЯ
  function showDialogueEvent() {
    document.getElementById('stage-content').innerHTML = `
      <div class="game-card">
        <div style="font-size:12px; color:var(--accent);">ВСТРЕЧА В ПУТИ</div>
        <div class="art-container"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=NPC" class="art-img"></div>
        <div style="font-weight:bold; margin-bottom:5px;">Загадочный Торговец</div>
        <div class="dialogue-box" id="npc-dialogue"></div>
        <div class="swipe-hints">
          <button class="choice-btn" onclick="nextStep(false)">Пройти мимо</button>
          <button class="choice-btn" onclick="nextStep(true)">Купить (20 🪙)</button>
        </div>
      </div>
    `;
    typeText('npc-dialogue', "«Псс, путник... Туман близко. Не хочешь усилить свой клинок за пару монет?»");
  }

  // АНИМАЦИЯ БОЯ С КАРТИНКАМИ
  function startBattle(enemy) {
    let eHp = enemy.hp;
    document.getElementById('stage-content').innerHTML = `
      <div class="battle-arena">
        <div style="color:var(--hp); font-weight:900;">${enemy.isBoss ? 'БИТВА С БОССОМ' : 'АВТОБОЙ'}</div>
        <div class="fighters-row">
          <div class="fighter" id="hero-model">
            <div class="art-container" style="border-color:var(--accent)"><img src="${assets.hero}" class="art-img"></div>
            <div>❤️ ${state.hp}</div>
          </div>
          <div class="slash-effect" id="slash"></div>
          <div class="fighter" id="enemy-model">
            <div class="art-container" style="border-color:var(--hp)"><img src="${enemy.img}" class="art-img"></div>
            <div id="e-hp-txt">❤️ ${eHp}</div>
          </div>
        </div>
        <div class="dialogue-box" id="battle-log" style="text-align:center;">Противники сближаются...</div>
      </div>
    `;

    const timer = setInterval(() => {
      const hero = document.getElementById('hero-model');
      const opp = document.getElementById('enemy-model');
      const slash = document.getElementById('slash');
      
      // Анимация удара героя
      hero.classList.add('atk-right');
      setTimeout(() => {
        hero.classList.remove('atk-right');
        opp.classList.add('hit-shake');
        slash.classList.add('slash-active');
        eHp -= state.atk * 2; 
        document.getElementById('e-hp-txt').innerText = `❤️ ${Math.max(0, eHp)}`;
        document.getElementById('battle-log').innerText = `Ты наносишь мощный удар!`;
        haptic('medium');
        
        setTimeout(() => { opp.classList.remove('hit-shake'); slash.classList.remove('slash-active'); }, 200);
        
        if (eHp <= 0) {
          clearInterval(timer);
          state.gold += 30;
          setTimeout(() => showLoot(), 800);
          return;
        }

        // Ответный удар врага
        setTimeout(() => {
          opp.classList.add('atk-left');
          setTimeout(() => {
            opp.classList.remove('atk-left');
            hero.classList.add('hit-shake');
            state.hp -= enemy.atk;
            updateHUD();
            document.getElementById('battle-log').innerText = `${enemy.name} контратакует!`;
            haptic('heavy');
            setTimeout(() => hero.classList.remove('hit-shake'), 200);
            
            if (state.hp <= 0) clearInterval(timer);
          }, 150);
        }, 600);
      }, 150);
    }, 1800);
  }

  function showLoot() {
    document.getElementById('stage-content').innerHTML = `
      <div class="game-card">
        <div style="color:var(--gold); font-weight:bold;">ТРОФЕЙ</div>
        <div class="art-container" style="border-color:var(--gold); background:#2a2015;">
          <img src="${assets.items.weapon.img}" class="art-img" style="padding:15px;">
        </div>
        <h3>Эфирный Клинок</h3>
        <p style="color:var(--muted); font-size:13px; margin:10px 0;">+15 к Атаке</p>
        <button class="choice-btn" style="width:100%" onclick="nextStep(false)">Забрать и идти дальше</button>
      </div>
    `;
  }

  function nextStep(bought) {
    if(bought && state.gold >= 20) { state.gold -= 20; state.atk += 5; }
    state.step++;
    if (state.step > state.maxSteps) { state.step = 1; state.hp = state.maxHp; } // Новый акт
    runForward();
  }

  runForward();
</script>
</body>
</html>
